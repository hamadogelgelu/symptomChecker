<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id ="header">
        <h1>Symptom Checker</h1>
    </div>
        <h3>Symptoms:</h3>
        <label class="enter">Enter Symptoms:</label>
        <input type="text" id="symptomInput" placeholder="Enter a symptom" autocomplete="off" />
        <button type="button" id="addSymptomBtn">Add Symptom</button>

    
    <ul id ="selectedSymptoms"></ul>
    <br>
    <label for="ageInput">Age: </label>
    <input type ="number" id="ageInput" placeholder="Enter Your Age" min="0">
    <br>
    <br>
    <label id="genderLabel">Sex: Unselected</label>
    <button type="button" id="genderMale">Male</button>
    <button type="button" id="genderFemale">Female</button>
    <br>
    <br>
    <label id = "height">Height: </label>
    <input type="number" id="heightInput" placeholder="Enter Your Height in cm" min="0">
    <br>
    <br>
    <label id = "weight">Weight: </label>
    <input type="number" id="weightInput" placeholder="Enter Your Weight in pounds" min="0">
    <br>
    <br>
    <h3>Allergies:</h3>
         <label class="enter">Enter Allergies:</label>
        <input type="text" id="allergyInput" placeholder="Enter an allergy" autocomplete="off" />
        <button type="button" id="addAllergy">Add Allergy</button>
 
   
    <ul id ="selectedAllergies"></ul>
    
    <br>
    <br> 
    <h3>Medical History:</h3>
        <label class="enter">Enter Medical History:</label>
        <input type="text" id="historyInput" placeholder="Enter Medical History" autocomplete="off" />
        <button type="button" id="addHistory">Add History</button>

   
    <ul id ="medicalHistory"></ul>
    <br>
    <br>
     <h3>Medications:</h3>
        <label class="enter">Enter Current Medications:</label>
        <input type="text" id="medicationInput" placeholder="Enter Medications" autocomplete="off" />
        <button type="button" id="addMedication">Add Medication</button>

   
    <ul id ="medicationsList"></ul>
    <br>
    <br>
    <h3>Lifestyle Questions:</h3>
    <div id='selectordiv'>
    <label>Smoking:</label>
    
    <input type="checkbox" id="smokeCheckbox">
    </div>
    <div id='selectordiv'>
         <label id="alcoholLabel">Alcohol: </label>
    <button type="button" id="alcoholNone">None</button>
    <button type="button" id="alcoholLight">Light</button>
    <button type="button" id="alcoholModerate">Moderate</button>
    <button type="button" id="alcoholHeavy">Heavy</button>
    </div>

    <div id='selectordiv'>
             <label id="exerciseLabel">Exercise: </label>
            <button type="button" id="exerciseNone">None</button>
            <button type="button" id="exerciseLight">Light</button>
            <button type="button" id="exerciseModerate">Moderate</button>
            <button type="button" id="exerciseHeavy">Heavy</button>
    </div>
   
    <div id='selectordiv'>
    <label id="dietLabel">Diet: </label>
    <button type="button" id="dietUnhealthy">None</button>
    <button type="button" id="dietModeratelyHealthy">Moderate</button>
    <button type="button" id="dietHealthy">Healthy</button>
    </div>
    <br>
    <button type="button" id="getDiagnosisBtn">Get Diagnosis</button>  

    <br>
    <br>
    <br>
    <br>
</body>
</html>

<script>
    const symptoms = [];
    let allergies = [];
    let medications = [];
    let medicalHistory = [];
    let smoking = false;
    let alcohol = '';
    let exercise = '';
    let diet = '';
    let age = 0;
    let height = 0;
    let weight = 0;
    let sex = '';
    function updateSymptomsList() {
        const selectedSymptomsList = document.getElementById('selectedSymptoms');
        selectedSymptomsList.innerHTML = '';
        symptoms.forEach((symptom, index) => {
            const li = document.createElement('li');
            li.textContent = symptom + ' ';
            const removeBtn = document.createElement('button');
            removeBtn.textContent = 'x';
            removeBtn.style.marginLeft = '8px';
            removeBtn.onclick = function() {
                symptoms.splice(index, 1);
                updateSymptomsList();
            };
            li.appendChild(removeBtn);
            selectedSymptomsList.appendChild(li);
        });
    }

    function updateUserData() {
        let userData = {
            symptoms: symptoms,
            age: age,
            sex: sex,
            height: height,
            weight: weight,
            lifestyle: {
                smoking: smoking,
                alcohol: alcohol,
                exercise: exercise,
                diet: diet
            },
            medicalHistory: medicalHistory,
            medications: medications,


        }
        return userData;
    }

    function updateMedicalHistory()
    {

        let medicalHistoryList = document.getElementById('medicalHistory');
        medicalHistoryList.innerHTML = '';
        for (const history of medicalHistory) {
            let li = document.createElement('li');
            li.textContent = history + ' ';
            let removebtn = document.createElement('button');
            removebtn.textContent = 'x';
            removebtn.style.marginLeft = '8px';
            removebtn.onclick = function() {
                medicalHistory = medicalHistory.filter(a => a != history)
                updateMedicalHistory();
            }
            li.appendChild(removebtn);
            medicalHistoryList.appendChild(li);
        }
        
        
    }

    function updateAllergiesList() {
        let allergiesList = document.getElementById('selectedAllergies');
        allergiesList.innerHTML = '';
        for (const allergy of allergies) {
            let li = document.createElement('li')
            li.textContent = allergy + ' ';
            let removeBtn = document.createElement('button');
            removeBtn.textContent = 'x';
            removeBtn.style.marginLeft = '8px';
            removeBtn.onclick = function() {
                allergies = allergies.filter(a => a !==allergy)
                updateAllergiesList();
            }
            li.appendChild(removeBtn);
            allergiesList.appendChild(li);
        }
    }

    document.getElementById('addSymptomBtn').addEventListener('click', function() {
        const input = document.getElementById('symptomInput');
        const symptom = input.value.trim();
        if (symptom && !symptoms.includes(symptom) && symptom !== 'Symptom already added') {
            symptoms.push(symptom);
            updateSymptomsList();
            input.value = '';
        }
        else if (symptom && symptoms.includes(symptom)) {
            input.value = 'Symptom already added';
            document.getElementById('symptomInput').addEventListener('focus', function() {
            if (input.value === 'Symptom already added') {
                input.value = '';
            }
          });
            
        }
    });

    document.getElementById('addHistory').addEventListener('click', function(){
        let input = document.getElementById('historyInput');
        let history = input.value.trim();
        if (history && !medicalHistory.includes(history) && history !== 'History already added')
        {
            medicalHistory.push(history);
            input.value = '';
            updateMedicalHistory();
        }
        else if (history && medicalHistory.includes(history))
        {
            input.value = 'History already added';
            document.getElementById('historyInput').addEventListener('focus', function() {
                if (input.value === 'History already added') {
                    input.value = '';
                }
            });
        }
    })

    
    document.getElementById('genderMale').addEventListener('click', function(){
        const genderLabel = document.getElementById('genderLabel');
        genderLabel.textContent = 'Sex: Male';
        sex = 'Male';
    })
    document.getElementById('genderFemale').addEventListener('click', function(){
        const genderLabel = document.getElementById('genderLabel');
        genderLabel.textContent = 'Sex: Female';
        sex = 'Female';
    })

    document.getElementById('addAllergy').addEventListener('click', function() {
        let input = document.getElementById('allergyInput');
        let allergy = input.value.trim();
        if (allergy && !allergies.includes(allergy) && allergy !== 'Allergy already added')
        {
            allergies.push(allergy);
            input.value = '';
        }
        else if (allergy && allergies.includes(allergy))
        {
            input.value = 'Allergy already added';
            document.getElementById('allergyInput').addEventListener('focus', function() {
                if (input.value === 'Allergy already added') {
                    input.value = '';
                }
            });
        }

        updateAllergiesList();
        console.log(allergies);
    })

    document.getElementById('addMedication').addEventListener('click', function() {
        let input = document.getElementById('medicationInput');
        let medication = input.value.trim();
        if (medication && !medications.includes(medication) && medication !== 'Medication already added')
        {
            medications.push(medication);
            input.value = '';
        }
        else if (medication && medications.includes(medication))
        {
            input.value = 'Medication already added';
            document.getElementById('medicationInput').addEventListener('focus', function() {
                if (input.value === 'Medication already added') {
                    input.value = '';
                }
            });
        }
        updateMedicationsList();
    })

    function updateMedicationsList() {
        let medicationsList = document.getElementById('medicationsList');
        medicationsList.innerHTML = '';
        for (const medication of medications) {
            let li = document.createElement('li');
            li.textContent = medication + ' ';
            let removeBtn = document.createElement('button');
            removeBtn.textContent = 'x';
            removeBtn.style.marginLeft = '8px';
            removeBtn.onclick = function() {
                medications = medications.filter(m => m !== medication);
                updateMedicationsList();
            };
            li.appendChild(removeBtn);
            medicationsList.appendChild(li);
        }
    }

    document.getElementById('smokeCheckbox').addEventListener('change', function() {
        smoking = this.checked;
    });

    document.getElementById('alcoholNone').addEventListener('click', function() {
        alcohol = 'None';
        label = document.getElementById('alcoholLabel');
        label.textContent = 'Alcohol: None';
    });
    document.getElementById('alcoholLight').addEventListener('click', function() {
        alcohol = 'Light';
        label = document.getElementById('alcoholLabel');
        label.textContent = 'Alcohol: Light';
    });
    document.getElementById('alcoholModerate').addEventListener('click', function() {
        alcohol = 'Moderate';
        label = document.getElementById('alcoholLabel');
        label.textContent = 'Alcohol: Moderate';
    });
    document.getElementById('alcoholHeavy').addEventListener('click', function() {
        alcohol = 'Heavy';
        label = document.getElementById('alcoholLabel');
        label.textContent = 'Alcohol: Heavy';
    });
    document.getElementById('exerciseNone').addEventListener('click', function() {
        exercise = 'None';
        label = document.getElementById('exerciseLabel');
        label.textContent = 'Exercise: None';
    });
    document.getElementById('exerciseLight').addEventListener('click', function() {
        exercise = 'Light';
        label = document.getElementById('exerciseLabel');
        label.textContent = 'Exercise: Light';
    });
    document.getElementById('exerciseModerate').addEventListener('click', function() {
        exercise = 'Moderate';
        label = document.getElementById('exerciseLabel');
        label.textContent = 'Exercise: Moderate';
    });
    document.getElementById('exerciseHeavy').addEventListener('click', function() {
        exercise = 'Heavy';
        label = document.getElementById('exerciseLabel');
        label.textContent = 'Exercise: Heavy';
    });
    document.getElementById('dietUnhealthy').addEventListener('click', function() {
        diet = 'None';
        label = document.getElementById('dietLabel');
        label.textContent = 'Diet: None';
    });
    document.getElementById('dietModeratelyHealthy').addEventListener('click', function() {
        diet = 'Moderate';
        label = document.getElementById('dietLabel');
        label.textContent = 'Diet: Moderate';
    });
    document.getElementById('dietHealthy').addEventListener('click', function() {
        diet = 'Healthy';
        label = document.getElementById('dietLabel');
        label.textContent = 'Diet: Healthy';
    });
    document.getElementById('getDiagnosisBtn').addEventListener('click', function() {
        age = parseInt(document.getElementById('ageInput').value);
        height = parseInt(document.getElementById('heightInput').value);
        weight = parseInt(document.getElementById('weightInput').value);
       

        let data = updateUserData();
        
        async function callFunc(userData)
        {
            try { 
            let response = await getDiagnosis(userData); // Calls function from DiagnosisAPI.js
            console.log(response);
            const newTab = window.open('results.html');

            setTimeout(() => {
                 newTab.postMessage(response, '*'); // * allows all origins (can restrict this!)
            }, 500);
        // You can update the UI here with the diagnosis
        } catch (error) 
        {
        console.error(error);
        }
        }

        callFunc(data);

    });




</script>

<script src="DiagnosisAPI.js"></script>
